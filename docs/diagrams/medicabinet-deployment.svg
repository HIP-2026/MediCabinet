th: 1.5;"/><!--link push to app--><path d="M74.53,71.24 C42.1,95.23 6,131.86 6,176 C6,176 6,176 6,476 C6,517.97 26.35,560.4125 47.0175,592.6963 C57.3513,608.8381 67.7644,622.4403 75.7528,632.1739 C77.7499,634.6073 79.5955,636.7989 81.2504,638.728 C81.4572,638.9691 81.6611,639.2061 81.862,639.439 " fill="none" id="push-app" style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="81.862,639.439,79.0137,630.011,78.5967,635.6525,72.9552,635.2355,81.862,639.439" style="stroke: #383838; stroke-width: 1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="70" x="7" y="340.0669">notification</text><!--
@startuml medicabinet-deployment
skinparam monochrome true
skinparam shadowing false
skinparam componentStyle uml2
skinparam defaultFontName Helvetica
top to bottom direction

component "Drug Database\nProvider (external)" as ddb
component "Notification Provider\nWeb Push / E-Mail (external)" as push

() "Drug Data\nAPI" as ddbS
() "Notification\nAPI" as pushS

ddb -down- ddbS
push -down- pushS

component "MediCabinet Backend Server" as backend {
  component "Inventory" as inv
  component "Medication\nCatalog" as cat
  component "Interaction\nChecker" as ic
  component "Reminder &\nAlerts" as alerts
}

cat -up-( ddbS
alerts -up-( pushS

() "Inventory\nService" as invS
() "Catalog\nService" as catS
() "Interaction\nService" as icS
() "Reminder\nService" as remS

inv -down- invS
cat -down- catS
ic -down- icS
alerts -down- remS

ic -( catS
alerts -( invS

component "MediCabinet Webapp" as app {
  component "Scan & Add" as scan
  component "Inventory\nBrowser" as browse
  component "Dose &\nReminder UI" as dose
}

scan -up-( invS
scan -up-( catS
browse -up-( invS
dose -up-( remS
dose -up-( icS
push ..> app : notification
@enduml

